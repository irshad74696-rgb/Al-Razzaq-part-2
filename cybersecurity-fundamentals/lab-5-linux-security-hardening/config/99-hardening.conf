# /etc/ssh/sshd_config.d/99-hardening.conf
#
# Drop-in instead of editing sshd_config: easy to review, easy to remove, and
# it survives package upgrades that replace the main file. OpenSSH uses the
# FIRST value it reads for each keyword, and Ubuntu's sshd_config includes
# sshd_config.d/*.conf at the very top, in name order. Files named 50-... (for
# example 50-cloud-init.conf) are read before this one and would win, so check
# with "sshd -T" afterwards, or rename this file 01-hardening.conf.
#
# Install:  cp 99-hardening.conf /etc/ssh/sshd_config.d/
#           sshd -t && systemctl restart ssh
# Keep a second root shell open until a new key login works.

# Port: on Ubuntu 22.10+ ssh.socket owns the port, see the README.
Port 2222

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
# Replaces ChallengeResponseAuthentication, deprecated since OpenSSH 8.7.
KbdInteractiveAuthentication no
KerberosAuthentication no
GSSAPIAuthentication no

MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60

# Drop a dead or idle client after 300 s x 2 missed keepalives = 10 minutes.
ClientAliveInterval 300
ClientAliveCountMax 2

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no

# Only these accounts may log in over SSH. Change to your own username.
AllowUsers irshadali

LogLevel VERBOSE
