<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="t d">
  <title id="t">Cryptography with Python</title>
  <desc id="d">Three building blocks: SHA-256 proves a file did not change, AES-256 with PBKDF2 keeps it secret, and an HMAC check catches tampering and wrong passwords. Below, a test showing that AES-CBC without an HMAC let one flipped byte turn 100 into 900, and that the HMAC version rejects it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c2a47" stroke-width="1"/>
    </pattern>
    <style>
      .h  { font: 700 46px 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; fill: #f1f5f9; }
      .sub{ font: 400 22px 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; fill: #94a3b8; }
      .q  { font: 800 30px 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; }
      .tool{ font: 700 21px 'DejaVu Sans Mono', Consolas, monospace; fill: #e2e8f0; }
      .p  { font: 400 17px 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; fill: #cbd5e1; }
      .mono{ font: 400 16px 'DejaVu Sans Mono', Consolas, monospace; fill: #cbd5e1; }
      .dim { font: 400 16px 'DejaVu Sans Mono', Consolas, monospace; fill: #64748b; }
      .tag { font: 700 15px 'DejaVu Sans Mono', Consolas, monospace; }
      .foot{ font: 600 18px 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#grid)" opacity="0.5"/>

  <!-- padlock mark -->
  <g transform="translate(64 40)">
    <path d="M12 30 V20 C12 8 20 2 28 2 C36 2 44 8 44 20 V30" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <rect x="0" y="28" width="56" height="42" rx="8" fill="#0ea5e9" opacity="0.18" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="28" cy="46" r="6" fill="#38bdf8"/>
    <rect x="25.5" y="48" width="5" height="12" rx="2" fill="#38bdf8"/>
  </g>
  <text x="136" y="82" class="h">Cryptography with Python</text>
  <text x="136" y="116" class="sub">Hashing, encryption and the check that most tutorials leave out</text>

  <!-- card 1 -->
  <g transform="translate(60 150)">
    <rect width="340" height="210" rx="16" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="24" y="48" class="q" fill="#22c55e">UNCHANGED?</text>
    <text x="24" y="84" class="tool">SHA-256</text>
    <text x="24" y="118" class="p">A 64-character fingerprint.</text>
    <text x="24" y="142" class="p">Change one bit and every</text>
    <text x="24" y="166" class="p">character changes. Proves</text>
    <text x="24" y="190" class="p">integrity, but hides nothing.</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(430 150)">
    <rect width="340" height="210" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="24" y="48" class="q" fill="#38bdf8">SECRET?</text>
    <text x="24" y="84" class="tool">AES-256 + PBKDF2</text>
    <text x="24" y="118" class="p">600,000 rounds turn a password</text>
    <text x="24" y="142" class="p">into a key, with a fresh salt</text>
    <text x="24" y="166" class="p">and IV per file. Keys and</text>
    <text x="24" y="190" class="p">outputs saved as mode 600.</text>
  </g>

  <!-- card 3 -->
  <g transform="translate(800 150)">
    <rect width="340" height="210" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="24" y="48" class="q" fill="#f59e0b">GENUINE?</text>
    <text x="24" y="84" class="tool">HMAC-SHA256</text>
    <text x="24" y="118" class="p">Checked before decrypting.</text>
    <text x="24" y="142" class="p">A wrong password or a single</text>
    <text x="24" y="166" class="p">changed byte is rejected and</text>
    <text x="24" y="190" class="p">nothing is written to disk.</text>
  </g>

  <!-- terminal -->
  <g transform="translate(60 388)">
    <rect width="1080" height="170" rx="14" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <circle cx="26" cy="22" r="6" fill="#ef4444"/>
    <circle cx="46" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="66" cy="22" r="6" fill="#22c55e"/>
    <text x="92" y="27" class="dim"># flip one byte of an AES-CBC file that says "Pay Ali 100 USD"</text>
    <text x="26" y="66" class="tag" fill="#ef4444">NO MAC  </text>
    <text x="130" y="66" class="mono">decrypts to: Pay Ali <tspan fill="#ef4444" font-weight="700">9</tspan>00 USD</text>
    <text x="560" y="66" class="dim">no error, no key needed</text>
    <text x="26" y="96" class="tag" fill="#ef4444">NO MAC  </text>
    <text x="130" y="96" class="mono">wrong passwords "accepted": ~1 in 256</text>
    <text x="560" y="96" class="dim">garbage output, exit 0</text>
    <text x="26" y="128" class="tag" fill="#22c55e">WITH MAC</text>
    <text x="130" y="128" class="mono">Decryption failed: wrong password, or the file was modified</text>
    <text x="130" y="154" class="dim">19 automated tests: tampered bytes, wrong keys, vault, audit — all pass</text>
  </g>

  <text x="60" y="596" class="foot">Irshad Ali  ·  Python security labs</text>
  <text x="1140" y="596" class="foot" text-anchor="end">#Cryptography  #Python  #InfoSec</text>
</svg>
